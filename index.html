<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma boussole de métiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EE;--surface:#FFFFFF;--ink:#17252B;--muted:#56666C;--line:#D3DCD6;
  --lake:#0F3B4C;--lake-ink:#FFFFFF;--pine:#2F6B55;--signal:#E8B23A;--alert:#A8324A;
  --soft-pine:#E1EDE6;--soft-alert:#F6E3E7;--soft-signal:#FBF0D5;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1A1F;--surface:#15252C;--ink:#E4ECE8;--muted:#9AABAF;--line:#2A3D44;
  --lake:#8CC3D3;--lake-ink:#0E1A1F;--pine:#7CC0A3;--signal:#F0C35A;--alert:#F08A9C;
  --soft-pine:#1B3530;--soft-alert:#3A2229;--soft-signal:#3A3220;}}
:root[data-theme="dark"]{
  --bg:#0E1A1F;--surface:#15252C;--ink:#E4ECE8;--muted:#9AABAF;--line:#2A3D44;
  --lake:#8CC3D3;--lake-ink:#0E1A1F;--pine:#7CC0A3;--signal:#F0C35A;--alert:#F08A9C;
  --soft-pine:#1B3530;--soft-alert:#3A2229;--soft-signal:#3A3220;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px 20px 64px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:center;gap:.5rem}
.brand svg{flex:none}
.reset{background:none;border:1px solid var(--line);border-radius:999px;padding:.35rem .9rem;font-size:.9rem;color:var(--muted)}
.reset:hover{border-color:var(--alert);color:var(--alert)}
.trail{display:flex;gap:6px;margin:18px 0 28px;align-items:center}
.trail span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.trail span.on{background:var(--pine)}
.trail span.now{background:var(--signal)}
.trail-label{font-size:.85rem;color:var(--muted);margin:-18px 0 24px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.02;letter-spacing:-.03em;margin:.2em 0 .35em}
h2{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,4.5vw,2.1rem);line-height:1.12;letter-spacing:-.02em;margin:.2em 0 .5em}
h3{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.2;margin:0 0 .3em}
p{margin:0 0 1em;max-width:62ch}
.lede{font-size:1.12rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;border-radius:12px;padding:.85rem 1.3rem;font-weight:700;background:var(--lake);color:var(--lake-ink);min-height:48px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.steps-intro{display:grid;gap:14px;margin:26px 0 30px;padding:0;list-style:none;counter-reset:s}
.steps-intro li{display:grid;grid-template-columns:2.2rem 1fr;gap:12px;align-items:start;counter-increment:s}
.steps-intro li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:1.1rem;width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;background:var(--soft-pine);color:var(--pine)}
.steps-intro b{display:block}
.steps-intro span{color:var(--muted)}
/* quiz */
.qcount{font-size:.9rem;color:var(--muted);margin-bottom:.4rem}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(1.45rem,4.6vw,2rem);line-height:1.18;letter-spacing:-.015em;margin:0 0 1.2em;max-width:30ch}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button,.choices button{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.9rem .4rem;min-height:64px;font-size:.92rem;line-height:1.2}
.scale button:hover,.choices button:hover{border-color:var(--lake)}
.scale button.sel,.choices button.sel{border-color:var(--pine);background:var(--soft-pine);font-weight:700}
.scale button i{display:block;font-style:normal;font-family:var(--display);font-weight:800;font-size:1.3rem;margin-bottom:.15rem}
.choices{display:grid;gap:10px}
.choices button{text-align:left;padding:1rem 1.1rem;font-size:1rem}
@media (max-width:520px){.scale{grid-template-columns:1fr}.scale button{display:flex;gap:.8rem;align-items:center;text-align:left;min-height:52px;padding:.6rem 1rem}.scale button i{margin:0;width:1.4rem}}
.back{background:none;border:0;color:var(--muted);padding:.6rem 0;margin-top:14px;text-decoration:underline;text-underline-offset:3px}
/* job card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 24px}
.card .jt{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 .45em}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tag{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;border-radius:999px;padding:.25rem .7rem;background:var(--bg);border:1px solid var(--line)}
.dot{width:.6rem;height:.6rem;border-radius:50%;display:inline-block}
.ai-F{background:var(--pine)}.ai-M{background:var(--signal)}.ai-E{background:var(--alert)}
.why{font-size:.93rem;color:var(--muted);margin-top:12px}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px}
.tri button{border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:1rem .5rem;font-weight:700;min-height:60px}
.tri .y{background:var(--pine);border-color:var(--pine);color:var(--lake-ink)}
.tri .m{background:var(--soft-signal);border-color:var(--signal)}
.tri .n:hover{border-color:var(--alert);color:var(--alert)}
.tri small{display:block;font-weight:400;font-size:.75rem;opacity:.75}
.meta-line{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:10px}
/* duel */
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin-top:10px}
.pick{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:.6rem;min-height:220px;transition:border-color .15s,transform .15s}
.pick:hover{border-color:var(--signal);transform:translateY(-2px)}
.pick .jt{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,3.6vw,1.7rem);line-height:1.08;letter-spacing:-.02em}
.pick .d{color:var(--muted);font-size:.95rem}
.or{align-self:center;font-family:var(--display);font-weight:800;font-size:1.1rem;width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;background:var(--signal);color:#17252B}
@media (max-width:600px){.duel{grid-template-columns:1fr}.or{justify-self:center;margin:-4px 0}.pick{min-height:0}}
@media (prefers-reduced-motion:reduce){.pick{transition:none}.pick:hover{transform:none}}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 20px}
.bar b{display:block;height:100%;background:var(--pine);transition:width .3s}
/* results */
.res{display:grid;gap:12px;margin:22px 0}
details.r{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
details.r[open]{border-color:var(--lake)}
details.r summary{list-style:none;display:grid;grid-template-columns:2.6rem 1fr auto;gap:12px;align-items:center;padding:16px 18px;cursor:pointer}
details.r summary::-webkit-details-marker{display:none}
.rank{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--pine);text-align:center}
details.r:first-of-type .rank{color:var(--ink);background:var(--signal);border-radius:10px;padding:.1rem 0}
.rt{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.15}
.chev{color:var(--muted);transition:transform .2s}
details.r[open] .chev{transform:rotate(180deg)}
.rbody{padding:0 18px 20px 18px;border-top:1px solid var(--line)}
.flag{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--soft-alert);border-left:4px solid var(--alert);font-size:.93rem}
.flag.c1{background:var(--soft-signal);border-left-color:var(--signal)}
.flag b{display:block}
.prog{margin-top:18px}
.prog h4{margin:0 0 8px;font-size:1rem}
.unis{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.unis li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:.45rem .6rem;border-radius:8px;font-size:.93rem}
.unis li:nth-child(odd){background:var(--bg)}
.km{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.near{font-weight:700}
.near .km{color:var(--pine)}
.band{font-size:.75rem;border-radius:999px;padding:.05rem .5rem;margin-left:.4rem;border:1px solid var(--line);color:var(--muted);font-weight:400}
.note{font-size:.88rem;color:var(--muted);margin-top:10px;font-style:italic}
.legend{font-size:.9rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:26px}
.legend p{max-width:none;margin:.4em 0}
.others{margin-top:18px;font-size:.95rem}
.fallback{width:100%;min-height:200px;margin-top:12px;font:inherit;font-size:.85rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,25,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal-bg.on{display:flex}
.modal{background:var(--surface);border-radius:18px;padding:24px;max-width:420px;width:100%}
.kbd{font-size:.82rem;color:var(--muted);margin-top:12px}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:16px}

.unis li{grid-template-columns:1fr auto auto;align-items:center}
.cr{font-variant-numeric:tabular-nums;font-size:.85rem;border-radius:6px;padding:.05rem .45rem;white-space:nowrap}
.cr.ok{background:var(--soft-pine);color:var(--pine)}
.cr.tight{background:var(--soft-signal)}
.cr.hi{background:var(--soft-alert);color:var(--alert)}
.cr.na{color:var(--muted)}
.derived{margin-top:14px;font-size:.93rem}
.derived b{display:block;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:.2rem .65rem;background:var(--bg)}
.also{font-size:.9rem;color:var(--muted);margin-top:12px}
.crbox{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:18px 0}
.crbox input{width:6.5rem;font:inherit;font-weight:700;font-size:1.1rem;padding:.4rem .6rem;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.crbox small{color:var(--muted);flex-basis:100%}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:12px 0 28px}
table.top{border-collapse:collapse;width:100%;min-width:620px;font-size:.93rem}
table.top th{text-align:left;font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
table.top td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.top tr:last-child td{border-bottom:0}
table.top td.n{font-family:var(--display);font-weight:800;color:var(--pine);width:2rem}
table.top .sub{display:block;font-size:.8rem;color:var(--muted)}
.st{font-size:.82rem;font-weight:700;border-radius:999px;padding:.15rem .6rem;white-space:nowrap;display:inline-block}
.st.ok{background:var(--soft-pine);color:var(--pine)}
.st.tight{background:var(--soft-signal)}
.st.hi{background:var(--soft-alert);color:var(--alert)}
.st.na{background:var(--bg);color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin:16px 0 20px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:.6rem .4rem;font-weight:700;font-size:.92rem;color:var(--muted);min-height:44px}
.tabs button.on{background:var(--lake);color:var(--lake-ink)}
.tabs button:not(.on):hover{color:var(--ink)}
.clist{display:grid;gap:10px;margin:10px 0 26px}
.ci{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ci-h{display:flex;justify-content:space-between;gap:10px;align-items:center;font-family:var(--display);font-size:1.1rem}
.ci-s{margin:.3em 0 0;font-size:.9rem;color:var(--pine);font-weight:700}
.ci-l{margin:.3em 0 0;font-size:.9rem;color:var(--muted)}
.ci-intro{color:var(--muted);font-size:.95rem}
h3{margin-top:1.4em}
.st.app{background:var(--soft-signal);border:1px dashed var(--signal);color:var(--ink)}
h4 .st{vertical-align:middle;margin-left:.4rem}
.crbox select{font:inherit;font-size:.95rem;padding:.45rem .6rem;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
.nd{font-size:.75rem;color:var(--muted);font-style:italic}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 5 L16 13 L13 21 L10 13 Z" fill="var(--signal)"/><path d="M13 13 L16 13 L13 21 L10 13 Z" fill="var(--pine)"/></svg>
      Ma boussole de métiers
    </div>
    <button class="reset" id="resetBtn" type="button">Réinitialiser</button>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<div class="modal-bg" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <h3 id="mTitle">Tout recommencer ?</h3>
    <p>Tes réponses dans les trois onglets (questions, tri, duels, métiers en vrac) seront effacées. Cette action ne peut pas être annulée.</p>
    <div class="row">
      <button class="btn" id="mYes" type="button" style="background:var(--alert)">Tout effacer</button>
      <button class="btn ghost" id="mNo" type="button">Annuler</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Universités (distance routière approximative depuis Saint-Jérôme) ---------- */
const U={
 uqosj:["UQO, campus de Saint-Jérôme",0],
 udeml:["Université de Montréal, campus Laval",35],
 udem:["Université de Montréal",55],
 poly:["Polytechnique Montréal",55],
 hec:["HEC Montréal",55],
 uqam:["UQAM",58],
 mcgill:["Université McGill",58],
 conc:["Université Concordia",60],
 ets:["ÉTS (École de technologie supérieure)",60],
 macd:["McGill, campus Macdonald (Sainte-Anne-de-Bellevue)",70],
 ushl:["Université de Sherbrooke, campus de Longueuil",70],
 udemsh:["Université de Montréal, campus de Saint-Hyacinthe",115],
 uqog:["UQO, campus de Gatineau",165],
 uqtr:["UQTR (Trois-Rivières)",175],
 ush:["Université de Sherbrooke",200],
 bish:["Université Bishop's (Sherbrooke)",200],
 ul:["Université Laval (Québec)",290],
 uqac:["UQAC (Chicoutimi)",500],
 uqat:["UQAT (Rouyn-Noranda)",580],
 uqar:["UQAR (Rimouski)",590]
};
function band(km){return km<=70?"aller-retour possible":km<=200?"moyenne distance":"déménagement"}

/* ---------- Cote R : valeurs du dernier admis, automne 2025 ----------
 nombre = plus basse cote R admise (médecine : plus basse convoquée en entrevue ou seuil)
 "nc" = non contingenté · "ncXX" = non contingenté, minimum XX · "~XX" = moyenne des admis
 "lt20" = moins de 20 · "e" = sur dossier / entrevue · "pg" = profil global (notes + motivation)
*/
function effR(v){if(typeof v==="number")return v;if(v==="nc")return 22;if(v==="lt20")return 20;let m;if(v&&(m=/^nc([\d.]+)$/.exec(v)))return+m[1];if(v&&(m=/^~([\d.]+)$/.exec(v)))return+m[1];return null}
function fmtR(v){
 const c=x=>(+x).toFixed(1).replace(".",",");
 if(typeof v==="number")return c(v);
 if(v==="nc")return"Non contingenté";
 if(v==="lt20")return"Moins de 20";
 if(v==="e")return"Sur dossier";
 if(v==="pg")return"Notes + motivation";
 let m;if(v&&(m=/^nc([\d.]+)$/.exec(v)))return"Non contingenté (min. "+c(m[1])+")";
 if(v&&(m=/^~([\d.]+)$/.exec(v)))return"≈ "+c(m[1])+" (moyenne)";
 return"n.d.";
}
function CR(){return st.cr??30}
function crClass(v){const e=effR(v);if(e==null)return"na";const d=e-CR();return d<=-1?"ok":d<=0.5?"tight":"hi"}

/* ---------- Métiers (tous exigent au minimum un baccalauréat) ----------
 dims : H aider · S santé · T terrain · L labo · I informatique · C construire · N nature · E enseigner · M chiffres · D créer · J lois/société
 ai : F faible · M modérée · E élevée    yrs : 1 = 3-4 ans · 2 = 5-6 ans · 3 = 7 ans et +
 derived : métiers connexes accessibles avec la même formation ("Titre:ai|...")
*/
const RAW=[
["gciv","Ingénieur·e civil·e","Concevoir des ponts, des routes, des bâtiments et des réseaux d'eau, puis suivre leur construction sur le chantier.","C3T2M1","F","Signature professionnelle (Ordre des ingénieurs) et travail sur le terrain : l'IA accélère les calculs, mais pas la responsabilité ni le chantier.",1,
 [["Génie civil",{poly:"nc27",conc:24,mcgill:28.5,ush:25.5,ul:"nc",uqac:"nc"}],["Génie de la construction",{ets:"nc"}]],"",
 "Gestionnaire de projets de construction:F|Ingénieur·e en structures:M|Ingénieur·e municipal·e:F|Ingénieur·e en transport:M"],
["gmec","Ingénieur·e mécanique","Concevoir des machines, des véhicules, des systèmes de chauffage ou des équipements de production.","C3L1M1D1","M","La conception assistée par IA progresse vite; les essais, la fabrication et la responsabilité restent humains.",1,
 [["Génie mécanique",{poly:"nc27",ets:"nc",conc:25,mcgill:33,ush:28.2,ul:"nc",uqtr:"nc24",uqac:"nc",uqar:"nc"}]],"",
 "Ingénieur·e en énergie renouvelable:M|Ingénieur·e en fabrication additive (impression 3D):M|Ingénieur·e en véhicules électriques:M"],
["gele","Ingénieur·e électrique","Concevoir des réseaux d'énergie, des circuits et des systèmes de contrôle, par exemple pour Hydro-Québec.","C3I1M1L1","M","Beaucoup de simulation et de conception automatisables, mais la transition énergétique crée une forte demande.",1,
 [["Génie électrique",{poly:"nc27",ets:"nc",conc:26,mcgill:32.3,ush:26.1,ul:"nc",uqtr:"nc24",uqog:"nc",uqac:"nc",uqar:"nc"}]],"",
 "Ingénieur·e en réseaux électriques:F|Ingénieur·e en télécommunications:M|Ingénieur·e en instrumentation et contrôle:M"],
["glog","Ingénieur·e logiciel","Concevoir de gros systèmes informatiques fiables : applications, plateformes, logiciels embarqués.","I3C1M1","E","L'IA écrit déjà une bonne part du code; le métier se déplace vers l'architecture, la sécurité et la supervision des outils d'IA.",1,

 const pick=list=>{let best=null;list.forEach(p=>{for(const u in p[1]){const e=effR(p[1][u]);if(e!=null&&(best==null||e<best.e))best={e,u,v:p[1][u]}}});return best};
 const open=entry.filter(p=>okPre(p[2]));
 if(open.length){const b=pick(open);return b?Object.assign(b,{app:false}):null}
 const b=pick(entry);return b?Object.assign(b,{app:true}):{app:true,e:null};
}
const GATE={orth:"maîtrise",aud:"maîtrise",psy:"doctorat",ips:"maîtrise IPS"};
function status(j){
 const b=bestEntry(j);
 if(b&&b.app)return{cls:"app",lbl:"Cours d'appoint requis"};
 if(GATE[j.id]&&(!b||b.e<=CR()+0.5))return{cls:"tight",lbl:(GATE[j.id]==="doctorat"?"Sélection au doctorat":"Sélection à la "+GATE[j.id])};
 if(!b||b.e==null)return{cls:"na",lbl:"Sur dossier"};
 const d=b.e-CR();
 return d<=-1?{cls:"ok",lbl:"À ta portée"}:d<=0.5?{cls:"tight",lbl:"Serré"}:{cls:"hi",lbl:"Hors de portée pour l'instant"};
}

const KEY="boussole-metiers-v4";
function fresh(){return{tab:"g",v:{order:[],i:0,r:{},cont:true},step:"welcome",qi:0,ans:{},order:[],scores:{},shown:FIRST,ti:0,tri:{},duel:null,final:null,extra:[],cr:null,dec:null}}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

/* ---------- Calcul des correspondances ---------- */
function computeOrder(){
 const A=st.ans, w=SETTINGS[A.W??5], P=A.P??1;
 JOBS.forEach(j=>{
  let num=0,den=0;
  for(const k in j.dims){const v=(A[k]??3)-3;num+=v*j.dims[k];den+=j.dims[k]}
  let s=den?num/den:0;
  const [set,bl,od,ur,pr]=ATTR[j.id]||["",0,0,0,0];
  if(w)s+=set.includes(w)?0.5:-0.2;
  if(bl)s+=((A.B??3)-3)*0.35*bl;
  if(od)s+=((A.O??3)-3)*0.25*od;
  if(ur)s+=((A.U??3)-3)*0.25*ur;
  if(P===2&&pr)s+=0.3;
  if(P===0)s+=pr?-0.2:0.1;
  if(!jobOpen(j))s-=0.4;
  st.scores[j.id]=+s.toFixed(3);
 });
 st.order=JOBS.map(j=>j.id).sort((a,b)=>st.scores[b]-st.scores[a]);
}

function estimate(n){let t=0;for(let k=1;k<n;k++)t+=Math.ceil(Math.log2(k+1));return t}
function startDuel(){
 const by=v=>st.order.filter(id=>st.tri[id]===v);
 let pool=by("y"); if(pool.length<2)pool=pool.concat(by("m"));
 st.extra=pool.slice(10); pool=pool.slice(0,10);
 if(pool.length===0)return;
 if(pool.length===1){st.final=pool;st.step="results";return render()}
 const shuffled=pool.slice().sort(()=>Math.random()-.5);
 st.duel={sorted:[shuffled[0]],queue:shuffled.slice(1),cur:null,lo:0,hi:0,done:0,total:estimate(pool.length),flip:false};
 nextInsert();
}
function nextInsert(){
 const d=st.duel;
 if(!d.queue.length){st.final=d.sorted.slice();st.step="results";st.duel=null;return render()}
 d.cur=d.queue.shift();d.lo=0;d.hi=d.sorted.length;
 st.step="duel";render();
}
function rDuel(){
 const d=st.duel, mid=Math.floor((d.lo+d.hi)/2), a=J[d.cur], b=J[d.sorted[mid]];
 d.flip=Math.random()<.5;
 const L=d.flip?b:a, R=d.flip?a:b;
 const pct=Math.min(100,Math.round(100*d.done/Math.max(1,d.total)));
 const card=(j,side)=>`<button class="pick" data-side="${side}"><span class="jt">${j.t}</span><span class="d">${j.d}</span><span class="tag" style="align-self:flex-start;margin-top:auto"><span class="dot ai-${j.ai}"></span>${AI_LBL[j.ai]}</span></button>`;
 app.innerHTML=`${trail(2)}
 <h2>Lequel te ressemble le plus ?</h2>
 <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><b style="width:${pct}%"></b></div>
 <div class="duel">${card(L,"L")}<div class="or">ou</div>${card(R,"R")}</div>
 <p class="kbd">Environ ${Math.max(0,d.total-d.done)} duel(s) restant(s). Touches ← et → pour choisir. Pas de mauvaise réponse : suis ton instinct.</p>`;
 app.querySelectorAll(".pick").forEach(p=>p.onclick=()=>duelPick(p.dataset.side));
}
function duelPick(side){
 const d=st.duel; if(!d)return;
 const mid=Math.floor((d.lo+d.hi)/2);
 const pickedCur=(side==="L")!==d.flip;
 if(pickedCur)d.hi=mid;else d.lo=mid+1;
 d.done++;
 if(d.lo>=d.hi){d.sorted.splice(d.lo,0,d.cur);nextInsert()}else render();
}

 for(const id of fill){if(ranked.length>=10)break;if(!seen.has(id)){seen.add(id);ranked.push({id,dec:false})}}
 return ranked;
}

const V=JOBS.map(j=>({k:j.id,t:j.t,d:j.d,p:j.id})).concat(EXTRA.map((x,i)=>({k:"x"+i,t:x[0],d:x[1],p:x[2]||null})));
const VK=Object.fromEntries(V.map(v=>[v.k,v]));
function rVrac(){
 const s=st.v, N=V.length, nb=Math.ceil(N/BATCH);
 const cnt=v=>Object.values(s.r).filter(x=>x===v).length;
 if(!s.order.length){
  app.innerHTML=`<h2>Métiers en vrac</h2>
  <p class="lede">Ici, pas de questions : ${N} métiers qui demandent un baccalauréat, dans le désordre. Pour chacun, réponds à l'instinct.</p>
  <p>Ils sont regroupés en ${nb} lots de ${BATCH}. Fais une pause entre les lots si tu veux : tout est sauvegardé. Si un métier ne te dit rien, choisis « Je ne connais pas » plutôt que de deviner.</p>
  <div class="row"><button class="btn" id="vgo">Commencer</button></div>`;
  vgo.onclick=()=>{s.order=V.map(v=>v.k).sort(()=>Math.random()-.5);s.i=0;s.r={};s.cont=true;render()};
  return;
 }
 if(s.i>=s.order.length){
  app.innerHTML=`<h2>C'est terminé !</h2>
  <p class="lede">${cnt("y")} métiers aimés, ${cnt("n")} écartés, ${cnt("u")} à découvrir.</p>
  <p>La vue combinée compare maintenant ces réponses avec ton parcours guidé.</p>
  <div class="row"><button class="btn" id="toC">Voir la vue combinée</button><button class="btn ghost" id="vre">Recommencer les métiers en vrac</button></div>`;
  toC.onclick=()=>{st.tab="c";render()};
  vre.onclick=()=>{st.v={order:[],i:0,r:{},cont:true};render()};
  return;
 }
 if(s.i>0&&s.i%BATCH===0&&!s.cont){
  app.innerHTML=`<h2>Lot ${s.i/BATCH} sur ${nb} terminé.</h2>
  <p class="lede">${cnt("y")} métiers aimés jusqu'ici. Tu peux continuer ou prendre une pause : ta progression est sauvegardée.</p>
  <div class="row"><button class="btn" id="vc">Continuer</button><button class="btn ghost" id="toC">Voir la vue combinée</button></div>`;
  vc.onclick=()=>{s.cont=true;render()};
  toC.onclick=()=>{st.tab="c";render()};
  return;
 }
 const v=VK[s.order[s.i]];
 app.innerHTML=`<div class="meta-line"><span>Métier ${s.i+1} sur ${N} · lot ${Math.floor(s.i/BATCH)+1} sur ${nb}</span><span>${cnt("y")} aimé(s)</span></div>
 <div class="bar"><b style="width:${Math.round(100*s.i/N)}%"></b></div>
 <div class="card"><div class="jt">${v.t}</div><p style="margin:0">${v.d}</p></div>
 <div class="tri">
  <button class="y" data-v="y">J'aime<small>touche →</small></button>
  <button class="m" data-v="u">Je ne connais pas<small>touche ↓</small></button>
  <button class="n" data-v="n">Je n'aime pas<small>touche ←</small></button>
 </div>
 ${s.i>0?`<button class="back" id="vbk">Revenir au métier précédent</button>`:""}`;
 app.querySelectorAll(".tri [data-v]").forEach(b=>b.onclick=()=>vrac(b.dataset.v));
 if(s.i>0)vbk.onclick=()=>{s.i--;s.cont=true;render()};
}
function vrac(x){const s=st.v;if(s.i>=s.order.length)return;s.r[s.order[s.i]]=x;s.i++;s.cont=false;render()}

/* ---------- Onglet 3 : vue combinée ---------- */
function rCombo(){
 const liked2={};V.forEach(v=>{if(st.v.r[v.k]==="y"&&v.p){(liked2[v.p]=liked2[v.p]||[]).push(v.t)}});
 const rank=id=>(st.final||[]).indexOf(id);
 const like1=id=>st.tri[id]==="y"||rank(id)>=0;
 const hasG=Object.keys(st.tri).length>0, hasV=Object.keys(st.v.r).length>0;
 if(!hasG||!hasV){
  app.innerHTML=`<h2>Vue combinée</h2><div class="empty"><p>Cette vue compare tes deux façons de choisir. Il faut avoir commencé les deux onglets.</p>
  <p>${hasG?"✓ Parcours guidé commencé":"○ Parcours guidé : pas encore commencé"}<br>${hasV?"✓ Métiers en vrac commencés":"○ Métiers en vrac : pas encore commencés"}</p>
  <div class="row"><button class="btn" id="goMissing">${!hasG?"Aller au parcours guidé":"Aller aux métiers en vrac"}</button></div></div>`;
  goMissing.onclick=()=>{st.tab=!hasG?"g":"v";render()};
  return;
 }
 const agree=Object.keys(liked2).filter(like1).sort((a,b)=>{const ra=rank(a),rb=rank(b);if(ra>=0&&rb>=0)return ra-rb;if(ra>=0)return-1;if(rb>=0)return 1;return liked2[b].length-liked2[a].length});
 const surprise=Object.keys(liked2).filter(id=>!like1(id)).sort((a,b)=>liked2[b].length-liked2[a].length);
 const why=id=>st.tri[id]==="n"?"Écarté au tri du parcours guidé":st.tri[id]==="m"?"« Peut-être » au parcours guidé":"Pas présenté au parcours guidé (moins aligné avec tes réponses au questionnaire)";
 const families=Object.keys(liked2).sort((a,b)=>liked2[b].length-liked2[a].length).slice(0,8);
 const unknown=V.filter(v=>st.v.r[v.k]==="u").map(v=>v.t);
 const orphans=V.filter(v=>st.v.r[v.k]==="y"&&!v.p).map(v=>v.t);
 const item=(id,sub)=>{const j=J[id];return`<div class="ci"><div class="ci-h"><b>${j.t}</b><span class="tag"><span class="dot ai-${j.ai}"></span>${AI_SHORT[j.ai]}</span></div>
  <p class="ci-s">${sub}</p><p class="ci-l">Aimés dans cette famille : ${liked2[id].join(", ")}</p></div>`};
 const done=st.v.i>=st.v.order.length;
 app.innerHTML=`<h2>Vue combinée</h2>
 <p class="lede">Chaque métier aimé dans « Métiers en vrac » est rattaché à la formation qui y mène. On compare ensuite avec ton parcours guidé.${done?"":` Tu as fait ${st.v.i} métiers en vrac sur ${V.length} : la vue s'enrichira en continuant.`}</p>

 <h3>Là où les deux approches se rejoignent</h3>
 <p class="ci-intro">Les signaux les plus forts : tu les as choisis dans le parcours guidé et aussi à l'instinct.</p>
 <div class="clist">${agree.length?agree.map(id=>item(id,rank(id)>=0?`Classé n° ${rank(id)+1} dans tes duels`:"Coup de cœur au tri du parcours guidé")).join(""):`<p class="empty">Aucun point commun pour l'instant.</p>`}</div>

 <h3>Surprises à explorer</h3>
 <p class="ci-intro">Aimés à l'instinct, mais pas retenus dans le parcours guidé. Ça vaut une discussion : le questionnaire a peut-être raté quelque chose.</p>
 <div class="clist">${surprise.length?surprise.map(id=>item(id,why(id))).join(""):`<p class="empty">Aucune surprise : tes deux approches sont cohérentes.</p>`}</div>

 <h3>Les formations qui reviennent le plus</h3>
 <p class="ci-intro">Nombre de métiers aimés en vrac auxquels chaque formation donne accès.</p>
 <div class="tblwrap"><table class="top"><thead><tr><th>Formation</th><th>Métiers aimés</th><th>Plus proche de Saint-Jérôme</th><th>Cote R la plus accessible</th></tr></thead><tbody>
 ${families.map(id=>{const j=J[id],p=j.progs[0],near=Object.keys(p[1]).sort((a,b)=>U[a][1]-U[b][1])[0],b=bestEntry(j),s=status(j);
  return`<tr><td><b>${p[0]}</b><span class="sub">mène à : ${j.t}</span></td><td class="n">${liked2[id].length}</td><td>${U[near][0]}<span class="sub">${U[near][1]===0?"sur place":"≈ "+U[near][1]+" km"}</span></td><td>${b?fmtR(b.v):"Sur dossier"} <span class="st ${s.cls}">${s.lbl}</span></td></tr>`}).join("")}
 </tbody></table></div>

 ${orphans.length?`<h3>Aimés, hors des formations du parcours guidé</h3><p>${orphans.join(", ")}.</p>`:""}
 ${unknown.length?`<h3>À découvrir</h3><p class="ci-intro">Tu ne connaissais pas ces métiers. Une recherche rapide ou une discussion pourrait en révéler un intéressant.</p><div class="chips">${unknown.map(t=>`<span class="chip">${t}</span>`).join("")}</div>`:""}
 <p class="kbd" style="margin-top:22px">Programme : ${DEC_LBL[st.dec||"sn"]}${st.dec?"":" (par défaut)"} · cote R : ${CR().toFixed(1).replace(".",",")}${st.cr==null?" (par défaut)":""}. Ces deux valeurs se choisissent au début du parcours guidé et se modifient dans ses résultats.</p>`;
}

/* ---------- Clavier ---------- */
document.addEventListener("keydown",e=>{
 if(document.getElementById("modal").classList.contains("on")){if(e.key==="Escape")closeModal();return}
 if(e.target&&e.target.tagName==="INPUT")return;
 if(st.tab==="v"){const s=st.v;if(s.order.length&&s.i<s.order.length&&!(s.i>0&&s.i%BATCH===0&&!s.cont)){if(e.key==="ArrowRight")vrac("y");else if(e.key==="ArrowLeft")vrac("n");else if(e.key==="ArrowDown"){e.preventDefault();vrac("u")}}return}
 if(st.tab!=="g")return;
 const q=Q[st.qi];
 if(st.step==="quiz"&&q&&!q.opts&&/^[1-5]$/.test(e.key))answer(+e.key);
 else if(st.step==="quiz"&&q&&q.opts&&/^[1-9]$/.test(e.key)&&+e.key<=q.opts.length)answer(+e.key-1);
 else if(st.step==="triage"){if(e.key==="ArrowRight")triage("y");else if(e.key==="ArrowDown"){e.preventDefault();triage("m")}else if(e.key==="ArrowLeft")triage("n")}
 else if(st.step==="duel"){if(e.key==="ArrowLeft")duelPick("L");else if(e.key==="ArrowRight")duelPick("R")}
});

/* ---------- Réinitialisation ---------- */
const modal=document.getElementById("modal");
function closeModal(){modal.classList.remove("on");document.getElementById("resetBtn").focus()}
document.getElementById("resetBtn").onclick=()=>{modal.classList.add("on");document.getElementById("mNo").focus()};
document.getElementById("mNo").onclick=closeModal;
modal.onclick=e=>{if(e.target===modal)closeModal()};
document.getElementById("mYes").onclick=()=>{
 try{localStorage.removeItem(KEY);localStorage.removeItem("boussole-metiers-v1");localStorage.removeItem("boussole-metiers-v2");localStorage.removeItem("boussole-metiers-v3")}catch(e){}
 st=fresh();closeModal();render();toast("Tout a été effacé");window.scrollTo(0,0);
};

render();
</script>
</body>
</html>
